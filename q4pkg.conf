# Q4OS package manifest - machine readable metadata for build tooling and agents
source="q4os-anydesk"
kind="external"
binaries="q4os-anydesk"
targets=""  # never published locally - see notes, same pattern as dropbox-extq
upstream_url="https://anydesk.com/en/downloads/linux"
upstream_watch="deb:http://deb.anydesk.com/ all main"
watch_pkg="anydesk"
notes="qinstaller shim (installer.cfg + setup_templates/, INCLUDE_DEB=1 -
adds AnyDesk's own vendor apt repo, APP_REPO='deb
[signed-by=/usr/share/keyrings/q4a-anydesk.gpg] http://deb.anydesk.com/ all
main' - see q4os_keyrings/q4p_keyring/q4a-anydesk.pub for the matching
trusted key) and PK_DEPENDS pulls the real 'anydesk' package from that vendor
repo at install time, same pattern as q4os-chrome/q4os-mxtools-common
(documented false positives for version_watch.sh - vendor version drift here
is expected/by design, not a bug). Confirmed genuinely never built/published
locally: no q4os-anydesk anywhere in repos_local_q4os or repos_local_quark
(neither q4repo/quarkrp nor qtderepo/quarktde) - matches the same
never-published pattern already documented for dropbox-extq
(external_sw/23_dropbox/code_wk_cpy/q4pkg.conf: 'no binaries found in local
repos, fill in manually'). This is expected for vendor-repo INCLUDE_DEB=1
shims: on a real install the qinstaller adds the vendor repo and apt pulls
'anydesk' directly - there is nothing Q4OS itself compiles or stages locally,
so smoke_pkg.sh would correctly SKIP this package (see CLAUDE.md's
smoke_pkg.sh note on vendor-not-mirrored shims)."
